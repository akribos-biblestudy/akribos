<!doctype html>
<html lang="de" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/icon.png" />
		<meta name="theme-color" content="#3f873f" />
		<script>
			// Apply the stored colour scheme before first paint, to avoid a flash of the wrong theme.
			// The cookie is this device's choice (set by the server, seeded from the account on a device
			// that has never chosen one); a leftover localStorage value from before the cookie existed is
			// migrated once so it is not silently forgotten.
			try {
				// Embedded editor preferences belong to its native host. Never migrate
				// browser storage or write reader/theme cookies from this isolated page.
				if (/^\/app\/editor\/[^/]+\/?$/.test(location.pathname)) {
					if (new URLSearchParams(location.search).get('theme') === 'dark')
						document.documentElement.classList.add('dark');
				} else {
					const match = document.cookie.match(/(?:^|; )theme=(light|dark)/);
					let stored = match ? match[1] : null;
					if (!stored) {
						const legacy = localStorage.getItem('theme');
						if (legacy === 'light' || legacy === 'dark') {
							stored = legacy;
							document.cookie = 'theme=' + legacy + '; path=/; max-age=31536000; samesite=lax';
						}
					}
					// Light is the default regardless of OS preference; only an explicit choice enables dark.
					if (stored === 'dark') document.documentElement.classList.add('dark');
				}
			} catch {
				// Cookies and localStorage can throw in private browsing modes; light remains the default.
			}
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
