# Production stack. This is the file Coolify deploys as a "Docker Compose" resource.
#
# For local development, run only the database with `pnpm db:start` (compose.dev.yaml) and the app
# itself with `pnpm dev`.
services:
  app:
    # Built by GitHub Actions after the test suite passes. Coolify must only pull this image; keeping
    # a `build:` section here would move the memory-intensive application build back onto the server.
    image: ghcr.io/akribos-biblestudy/akribos:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify substitutes the domain assigned to this service.
      ORIGIN: ${SERVICE_URL_APP:-http://localhost:3000}
      DATABASE_URL: postgres://strongs:${SERVICE_PASSWORD_POSTGRES:?}@db:5432/strongs
      SESSION_SECRET: ${SERVICE_BASE64_64_SESSION:?}
      # Trust the reverse proxy in front of us when reconstructing scheme, host and client address.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@akribos.de}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Akribos}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Encrypts the S3 secret access key stored in the settings table (admin-configured backups).
      BACKUP_ENCRYPTION_KEY: ${SERVICE_BASE64_64_BACKUP:?}
    volumes:
      - uploads:/app/var/uploads
      # Local safety-net copies of scheduled backups, alongside S3 (see /admin/backup). Same volume
      # name the old `backup` sidecar used, so its existing dumps stay on disk and restorable.
      - backups:/app/var/backups
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: strongs
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
      POSTGRES_DB: strongs
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U strongs -d strongs']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgdata:
  uploads:
  backups:
