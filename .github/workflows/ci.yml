name: CI

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgres://strongs:strongs@localhost:5432/strongs
  SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
  ORIGIN: http://localhost:4173
  BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-ci-backup-encryption-key

jobs:
  previous_ci:
    name: Look for CI on the same source tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    steps:
      - name: Verify the merged tree was tested in the pull request
        id: lookup
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          head_sha=$(gh api "$repo/commits/$GITHUB_SHA/pulls" | jq -r --arg sha "$GITHUB_SHA" '
            first(.[] | select(.merged_at and .merge_commit_sha == $sha and .base.ref == "main") | .head.sha) // empty
          ')
          if [[ -z "$head_sha" ]]; then
            echo 'No pull request matches this merge. Running CI.'
            exit 0
          fi

          tree=$(gh api "$repo/git/commits/$GITHUB_SHA" | jq -er '.tree.sha')
          runs=$(gh api --method GET "$repo/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f status=success -f head_sha="$head_sha" -F per_page=20 \
            --jq '.workflow_runs[] | [.id, .run_attempt] | @tsv')
          while IFS=$'\t' read -r run_id attempt; do
            [[ -n "$run_id" && -n "$attempt" ]] || continue
            matches=$(gh api --method GET "$repo/actions/runs/$run_id/artifacts" \
              -f name="tested-tree-$attempt-$tree" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [[ "$matches" == 1 ]]; then
              echo 'reuse=true' >> "$GITHUB_OUTPUT"
              echo "The same source tree passed CI in pull request run $run_id, attempt $attempt."
              exit 0
            fi
          done <<< "$runs"
          echo 'No successful pull request run matches this tree. Running CI.'

  check:
    name: Lint, types and unit tests
    needs: previous_ci
    if: ${{ !cancelled() && needs.previous_ci.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strongs
          POSTGRES_PASSWORD: strongs
          POSTGRES_DB: strongs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strongs -d strongs"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify reproducible PDF fonts
        run: |
          python -m pip install -r scripts/fonts/requirements.txt
          pnpm fonts:pdf:check
      - name: Install pinned PDF compiler and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pnpm pdf:setup
          echo "PDF_TYPST_BIN=$PWD/var/tools/typst/bin/typst" >> "$GITHUB_ENV"
      - run: pnpm run lint
      - run: pnpm run check
      # Most unit tests need no database, but the activation-token repository tests exercise real
      # queries against the schema, so migrations still have to run against the service above.
      - run: pnpm run db:migrate
      # Svelte component specs run through Vitest's Playwright browser project. Install the exact
      # Chromium revision selected by the lockfile instead of relying on a runner cache that may
      # contain the previous Playwright release.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:unit --run

  e2e:
    name: End-to-end tests
    needs: previous_ci
    if: ${{ !cancelled() && needs.previous_ci.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strongs
          POSTGRES_PASSWORD: strongs
          POSTGRES_DB: strongs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strongs -d strongs"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned PDF compiler and inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          pnpm pdf:setup
          echo "PDF_TYPST_BIN=$PWD/var/tools/typst/bin/typst" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu's own postgresql-client is older than the postgres:17-alpine service, and pg_dump
      # refuses to talk to a newer server; the admin backup feature needs the matching client.
      - name: Install postgresql-client-17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: Install pinned tutorial videos
        run: sh scripts/install-tutorial-videos.sh
      # Creates its own database, migrates and seeds the fixture, then runs against a production build.
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Build and publish container image
    needs: [previous_ci, check, e2e]
    if: >-
      ${{ !cancelled() && (
        (needs.check.result == 'success' && needs.e2e.result == 'success') ||
        (needs.previous_ci.result == 'success' && needs.previous_ci.outputs.reuse == 'true' &&
          needs.check.result == 'skipped' && needs.e2e.result == 'skipped')
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Record the tree checked out for the pull request
        id: tested_tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "sha=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/tested-tree.txt"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests and rewrite branches verify that the image builds. Only a successful push
          # to main publishes deployable tags.
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/akribos-biblestudy/akribos:latest
            ghcr.io/akribos-biblestudy/akribos:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the tested source tree ID
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ github.run_attempt }}-${{ steps.tested_tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree.txt
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to Coolify
    needs: [image]
    if: >-
      ${{ !cancelled() && needs.image.result == 'success' &&
        github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Set COOLIFY_WEBHOOK (the resource's deploy webhook URL) and COOLIFY_TOKEN as repository
    # secrets to enable deployment. Without them the step is skipped instead of failing.
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger deployment
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl --fail --silent --show-error \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
