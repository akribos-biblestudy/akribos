name: CI

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://strongs:strongs@localhost:5432/strongs
  SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-0123
  ORIGIN: http://localhost:4173
  BACKUP_ENCRYPTION_KEY: ci-backup-encryption-key-ci-backup-encryption-key

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strongs
          POSTGRES_PASSWORD: strongs
          POSTGRES_DB: strongs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strongs -d strongs"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      # Most unit tests need no database, but the activation-token repository tests exercise real
      # queries against the schema, so migrations still have to run against the service above.
      - run: pnpm run db:migrate
      # Svelte component specs run through Vitest's Playwright browser project. Install the exact
      # Chromium revision selected by the lockfile instead of relying on a runner cache that may
      # contain the previous Playwright release.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:unit --run

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: strongs
          POSTGRES_PASSWORD: strongs
          POSTGRES_DB: strongs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U strongs -d strongs"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Ubuntu's own postgresql-client is older than the postgres:17-alpine service, and pg_dump
      # refuses to talk to a newer server; the admin backup feature needs the matching client.
      - name: Install postgresql-client-17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      # Creates its own database, migrates and seeds the fixture, then runs against a production build.
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Build and publish container image
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests and rewrite branches verify that the image builds. Only a successful push
          # to main publishes deployable tags.
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/akribos-biblestudy/akribos:latest
            ghcr.io/akribos-biblestudy/akribos:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    needs: [image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Set COOLIFY_WEBHOOK (the resource's deploy webhook URL) and COOLIFY_TOKEN as repository
    # secrets to enable deployment. Without them the step is skipped instead of failing.
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger deployment
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl --fail --silent --show-error \
            --request GET "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
